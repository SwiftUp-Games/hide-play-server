name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2 Production Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || '16.178.63.129' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ℹ️ EC2_SSH_KEY secret is not set. Add your EC2 private key to GitHub Secrets to enable automatic CD."
          else
            echo "🚀 Deploying updates to AWS EC2 ($EC2_HOST)..."
            mkdir -p ~/.ssh
            echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "cd /home/ubuntu/hide-play-server && ./scripts/deploy-aws.sh"
            echo "✅ Successfully deployed to AWS EC2!"
          fi
