map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    client_max_body_size 25M;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Direct High-Speed Static Asset Serving via Nginx sendfile (Bypasses Node.js entirely)
    location ~* ^/(assets/|hpbanner\.(?:png|jpg)|favicon\.(?:ico|svg)|icons\.svg|.*\.png$|.*\.jpg$|.*\.css$|.*\.js$|.*\.wav$|.*\.woff2?$) {
        root /home/ubuntu/hide-play-server/public;
        try_files $uri @admin_static;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # 2. Fallback to Admin SPA assets
    location @admin_static {
        root /home/ubuntu/hide-play-server/admin/dist;
        try_files $uri @node_backend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        access_log off;
    }

    # 3. Dynamic API, Download page, and Real-time WebSocket Proxy
    location / {
        try_files $uri @node_backend;
    }

    location @node_backend {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Proxy identification headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Real-time low-latency tuning (zero buffering for voice & motion ticks)
        proxy_buffering off;
        proxy_request_buffering off;
        tcp_nodelay on;
        proxy_cache off;
        proxy_socket_keepalive on;

        # WebSocket long-lived connection timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
