services:
  - type: web
    name: hide-play-server
    runtime: node
    plan: free
    region: singapore # singapore provides ultra-low latency for India / SE Asia
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
